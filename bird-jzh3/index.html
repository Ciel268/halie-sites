<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e46a8a' d='M12 21s-8.5-5.2-8.5-11.4A4.8 4.8 0 0 1 12 6.8a4.8 4.8 0 0 1 8.5 2.8C20.5 15.8 12 21 12 21z'/%3E%3C/svg%3E">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; frame-src https://www.youtube-nocookie.com; base-uri 'self'; form-action 'none'; connect-src https://onlveogucibeoauevngi.supabase.co">
<meta name="theme-color" content="#2fb3a3">
<title>bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>:root{--bg:#fff1a8;--surface:#fffdf4;--text:#5a2e3a;--muted:#8a5a62;--accent:#2fb3a3;--soft:#ffd3b8;--on-accent:#ffffff;--btn-bg:#238477;--accent-text:#1f7369;
--font-h:"Pixelify Sans", sans-serif;--font-b:"Nunito", sans-serif;--font-script:"Pixelify Sans", sans-serif;
--scale:1;--radius-btn:2px;
--radius-img:3px;--radius-card:4px;
--space:5rem;--tint-1:color-mix(in srgb,var(--soft) 55%,var(--surface));--tint-2:#fff1df;--tint-3:#e8f6ef;--tint-4:#f1ebfb}
*,*::before,*::after{box-sizing:border-box}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:calc(1rem * var(--scale));line-height:1.7;overflow-x:hidden}
body.has-bg-image{background-image:linear-gradient(color-mix(in srgb,var(--bg) 84%,transparent),color-mix(in srgb,var(--bg) 84%,transparent)),var(--bg-image);background-size:cover;background-position:center;background-attachment:fixed}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-h);line-height:1.15;margin:0;font-weight:600}
p{margin:0 0 1em}
a{color:var(--accent-text,var(--accent))}
.section{position:relative;padding:var(--space) 1.25rem;overflow:hidden}
.section-inner{max-width:46rem;margin:0 auto;text-align:center}
.section-inner.wide{max-width:64rem}
.section-heading{font-size:calc(2rem * var(--scale));margin-bottom:.4em;color:var(--text)}
.section-sub{color:var(--muted);margin-top:-.4rem;margin-bottom:2rem}
.bg-surface{background:var(--surface)}
.bg-soft{background:var(--soft)}
.bg-accent{background:var(--accent);--text:var(--on-accent);--muted:color-mix(in srgb,var(--on-accent) 75%,transparent);color:var(--on-accent)}
.bg-accent .btn{background:var(--on-accent);color:var(--accent-text,var(--accent))}
.card{background:var(--surface);border-radius:var(--radius-card);padding:1.75rem 1.5rem;box-shadow:0 10px 30px -18px color-mix(in srgb,var(--text) 45%,transparent)}
.bordered .card{border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:none}
.bg-surface .card{background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;background:var(--btn-bg,var(--accent));color:var(--on-accent);padding:.85em 1.8em;border-radius:var(--radius-btn);transition:transform .2s,box-shadow .2s;box-shadow:0 8px 20px -10px var(--accent)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px}
.script{font-family:var(--font-script);font-weight:400}

/* Cover */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 1.25rem}
.hero-inner{position:relative;z-index:2;max-width:40rem}
.hero-eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.8rem;color:var(--accent-text,var(--accent));font-weight:600;margin-bottom:1rem}
.hero-title{font-size:calc(2.6rem * var(--scale));margin-bottom:1rem;color:var(--text)}
.hero-subtitle{font-size:1.1em;color:var(--muted);max-width:32rem;margin:0 auto 1.25rem}
.hero-date{font-family:var(--font-h);color:var(--accent-text,var(--accent));font-size:1.15em;margin-bottom:1.75rem;letter-spacing:.05em}
.hero.has-image{color:#fff}
.hero.has-image .hero-media{position:absolute;inset:0;background-size:cover;background-position:center}
.hero.has-image .hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.6))}
.hero.has-image .hero-title,.hero.has-image .hero-subtitle{color:#fff}
.hero.has-image .hero-eyebrow,.hero.has-image .hero-date{color:#fff;opacity:.92}
@media(min-width:768px){.hero-title{font-size:calc(4rem * var(--scale))}.section-heading{font-size:calc(2.6rem * var(--scale))}}

/* Letter */
.letter-card{text-align:left;padding:2.25rem 1.75rem;max-width:38rem;margin:0 auto}
.letter-greeting{font-family:var(--font-script);font-size:1.8em;color:var(--accent-text,var(--accent));margin-bottom:.6rem;line-height:1.3}
.letter-signature{font-family:var(--font-script);font-size:1.7em;color:var(--accent-text,var(--accent));text-align:right;margin:1.25rem 0 0;line-height:1.3}

/* Gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
@media(min-width:768px){.gallery-grid{grid-template-columns:repeat(3,1fr);gap:1rem}}
.gallery-item{margin:0;cursor:zoom-in}
.gallery-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:var(--radius-img);background:var(--soft)}
.gallery-item figcaption{font-size:.85em;color:var(--muted);margin-top:.4rem}
.gallery-polaroid{display:flex;flex-wrap:wrap;justify-content:center;gap:1.25rem}
.gallery-polaroid .gallery-item{background:#fff;padding:.6rem .6rem 1rem;width:calc(50% - .7rem);max-width:15rem;box-shadow:0 12px 28px -14px rgba(0,0,0,.4);transform:rotate(var(--tilt,0deg));transition:transform .3s}
.gallery-polaroid .gallery-item:hover{transform:rotate(0) scale(1.03)}
.gallery-polaroid .gallery-item img{border-radius:2px;aspect-ratio:4/5}
.gallery-polaroid figcaption{color:#444;font-family:var(--font-script);font-size:1.1em;text-align:center}
.gallery-stack{columns:2;column-gap:.75rem}
@media(min-width:768px){.gallery-stack{columns:3;column-gap:1rem}}
.gallery-stack .gallery-item{break-inside:avoid;margin-bottom:.75rem}
.gallery-stack .gallery-item img{aspect-ratio:auto}
.gallery-slider{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:1rem;-webkit-overflow-scrolling:touch}
.gallery-slider .gallery-item{flex:0 0 78%;scroll-snap-align:center}
@media(min-width:768px){.gallery-slider .gallery-item{flex-basis:42%}}
.gallery-slider .gallery-item img{aspect-ratio:4/5}
.placeholder{border:2px dashed color-mix(in srgb,var(--muted) 50%,transparent);border-radius:var(--radius-img);padding:2rem 1rem;color:var(--muted);font-size:.9em}

/* Timeline */
.timeline{list-style:none;padding:0;margin:0 auto;max-width:36rem;text-align:left;position:relative}
.timeline::before{content:"";position:absolute;left:.55rem;top:.4rem;bottom:.4rem;width:2px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.timeline li{position:relative;padding-left:2.4rem;margin-bottom:1.75rem}
.timeline li::before{content:"";position:absolute;left:0;top:.35rem;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.bg-surface .timeline li::before{background:var(--surface)}
.bg-soft .timeline li::before{background:var(--soft)}
.timeline-date{font-size:.8em;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-text,var(--accent));font-weight:600}
.timeline-title{font-size:1.25em;margin:.15rem 0 .25rem}
.timeline-text{color:var(--muted);margin:0}

/* Counter */
.counter-number{font-family:var(--font-h);font-size:calc(4.5rem * var(--scale));line-height:1;color:var(--accent-text,var(--accent));font-variant-numeric:tabular-nums}
.counter-unit{font-size:1.1em;color:var(--text);margin-top:.35rem}
.counter-breakdown{display:flex;justify-content:center;gap:1.25rem;flex-wrap:wrap;margin-top:1.5rem}
.counter-breakdown div{min-width:4.5rem}
.counter-breakdown b{display:block;font-family:var(--font-h);font-size:1.7em;color:var(--text);line-height:1.1}
.counter-breakdown span{font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.counter-caption{color:var(--muted);margin-top:1.25rem}

/* List */
.reasons{list-style:none;padding:0;margin:0 auto;max-width:34rem;text-align:left;display:grid;gap:.75rem}
.reasons li{display:flex;gap:.9rem;align-items:flex-start;background:var(--surface);padding:1rem 1.2rem;border-radius:var(--radius-card)}
.bg-surface .reasons li{background:var(--bg)}
.bordered .reasons li{border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.reasons .mark{flex:0 0 auto;color:var(--accent-text,var(--accent));font-weight:700;font-family:var(--font-h);min-width:1.5rem;text-align:center}

/* Surprise */
.surprise-content{margin-top:2rem}
.surprise-content[hidden]{display:none}
.surprise-content.shown{animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
.surprise-message{font-family:var(--font-h);font-size:1.6em;color:var(--text);line-height:1.35}
.surprise-content img{margin:1.5rem auto 0;border-radius:var(--radius-img);max-height:26rem;object-fit:cover}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* Details */
.details{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:640px){.details{grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}}
.details .card{padding:1.5rem}
.detail-label{font-size:.78em;text-transform:uppercase;letter-spacing:.15em;color:var(--accent-text,var(--accent));font-weight:600;margin-bottom:.4rem}
.detail-value{font-family:var(--font-h);font-size:1.2em;margin:0}

/* Quote */
.quote{font-family:var(--font-h);font-size:calc(1.7rem * var(--scale));line-height:1.35;margin:0;font-style:italic}
.quote-author{color:var(--muted);margin-top:1rem;font-style:normal}
.quote-mark{font-size:4rem;line-height:.6;color:var(--accent-text,var(--accent));font-family:Georgia,serif}

/* Closing */
.closing-heading{font-family:var(--font-script);font-weight:400;font-size:calc(2.8rem * var(--scale));color:var(--accent-text,var(--accent));margin-bottom:.5rem}
.closing-signature{font-family:var(--font-script);font-size:1.8em;color:var(--accent-text,var(--accent));margin-top:1rem}
.site-credit{text-align:center;font-size:.8rem;color:var(--muted);padding:1.5rem 1rem 2.5rem}

/* Reveal on scroll */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.reveal.in,.no-reveal .reveal{opacity:1;transform:none}

/* Floating particles */
.particles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.particle{position:absolute;bottom:-3rem;opacity:0;will-change:transform,opacity;animation:float-up linear infinite}
.particle.fall{top:-3rem;bottom:auto;animation-name:fall-down}
@keyframes float-up{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:var(--o,.7)}90%{opacity:var(--o,.7)}100%{transform:translate(var(--drift,20px),-110vh) rotate(var(--spin,40deg));opacity:0}}
@keyframes fall-down{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:var(--o,.8)}90%{opacity:var(--o,.8)}100%{transform:translate(var(--drift,30px),110vh) rotate(var(--spin,360deg));opacity:0}}
.burst{position:fixed;pointer-events:none;z-index:60;top:0;left:0}
.burst-piece{position:absolute;animation:burst 1.8s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* Music button */
.music-btn{position:fixed;right:1rem;bottom:1rem;z-index:40;width:3.1rem;height:3.1rem;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:var(--on-accent);font-size:1.25rem;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.music-btn.playing{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 20%,transparent)}}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,8,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.lightbox[hidden]{display:none}
.lightbox img{max-height:80vh;max-width:100%;border-radius:8px;object-fit:contain}
.lightbox p{color:#eee;margin-top:1rem;text-align:center}
.lightbox button{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:2.75rem;height:2.75rem;font-size:1.4rem;cursor:pointer}

/* Opening screens */
.opening{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:var(--bg);cursor:pointer;transition:opacity .9s ease,visibility .9s;text-align:center;padding:1.5rem}
.opening.done{opacity:0;visibility:hidden}
.opening-text{font-family:var(--font-h);font-size:1.25rem;color:var(--text);max-width:20rem}
.opening-hint{font-size:.85rem;color:var(--text);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{translate:0 -3px}}
.envelope{position:relative;width:15rem;height:10rem;background:var(--soft);border-radius:6px;box-shadow:0 20px 40px -20px rgba(0,0,0,.45)}
.envelope::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.5%,color-mix(in srgb,var(--accent) 22%,var(--soft)) 50%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49.5%,color-mix(in srgb,var(--accent) 22%,var(--soft)) 50%) right/50% 100% no-repeat;border-radius:6px}
.envelope-flap{position:absolute;left:0;right:0;top:0;height:60%;background:color-mix(in srgb,var(--accent) 35%,var(--soft));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:2}
.envelope-seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:3;color:var(--accent-text,var(--accent));font-size:2.2rem;transition:opacity .4s}
.opening.opened .envelope-flap{transform:rotateX(180deg)}
.opening.opened .envelope-seal{opacity:0}
.gift{position:relative;width:9rem;height:8rem;margin-top:2rem}
.gift-box{position:absolute;bottom:0;left:.5rem;right:.5rem;height:5.5rem;background:var(--accent);border-radius:6px}
.gift-lid{position:absolute;top:0;left:0;right:0;height:2.5rem;background:color-mix(in srgb,var(--accent) 80%,#000);border-radius:6px;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.gift-box::after,.gift-lid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.1rem;transform:translateX(-50%);background:var(--soft)}
.gift-bow{position:absolute;top:-1.7rem;left:50%;transform:translateX(-50%);line-height:0}
.opening.opened .gift-lid{transform:translateY(-4rem) rotate(-18deg)}
.opening.curtain{background:transparent}
.curtain-panel{position:absolute;top:0;bottom:0;width:50.5%;background:var(--accent);transition:transform 1.3s cubic-bezier(.7,0,.3,1)}
.curtain-panel.left{left:0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 14px,transparent 14px 34px)}
.curtain-panel.right{right:0;background-image:repeating-linear-gradient(-90deg,rgba(0,0,0,.08) 0 14px,transparent 14px 34px)}
.opening.curtain .opening-text,.opening.curtain .opening-hint{position:relative;z-index:2;color:var(--on-accent)}
.opening.curtain .opening-text{font-family:var(--font-script);font-size:2.6rem;max-width:none}
.opening.curtain.opened .curtain-panel.left{transform:translateX(-100%)}
.opening.curtain.opened .curtain-panel.right{transform:translateX(100%)}
.opening.curtain.opened .opening-text,.opening.curtain.opened .opening-hint{opacity:0;transition:opacity .4s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .particles,.burst{display:none}
  .reveal{opacity:1;transform:none}
}

.mode-screens{--font-title:var(--font-script);--panel:transparent;overflow-x:hidden}
.mode-screens main{position:relative;z-index:2}
.mode-screens .particles{z-index:1}
.ill{display:block;width:100%;height:auto;overflow:visible}
.i-a{fill:var(--accent)}.i-ad{fill:color-mix(in srgb,var(--accent) 72%,#000)}.i-al{fill:color-mix(in srgb,var(--accent) 45%,#fff)}
.i-s{fill:var(--soft)}.i-w{fill:#fffdf8}.i-g{fill:#6b9a5c}.i-gd{fill:#4b7443}
.i-p{fill:var(--petal,var(--accent))}.i-pd{fill:color-mix(in srgb,var(--petal,var(--accent)) 70%,#000)}
.i-ln{stroke:color-mix(in srgb,var(--petal,var(--accent)) 62%,#000)}
.i-o{stroke:color-mix(in srgb,var(--text) 55%,transparent)}

/* Background layer */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
.bg-svg{position:absolute;inset:0;width:100%;height:100%}
.pat-plain .bg-layer{background:radial-gradient(circle at 50% 28%,var(--soft),var(--bg) 72%)}
.pat-gingham .bg-layer{background-color:var(--bg);background-image:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent) 50%,transparent 0),linear-gradient(color-mix(in srgb,var(--accent) 22%,transparent) 50%,transparent 0);background-size:72px 72px}
.pat-checker .bg-layer{background:conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%,var(--soft) 0 75%,var(--bg) 0) 0 0/76px 76px}
.pat-hearts .bg-layer .pt-a{fill:var(--soft)}.pat-hearts .bg-layer .pt-b{fill:var(--accent);opacity:.16}
.pat-stars .bg-layer{background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 70%)}
.pat-stars .pt-line{fill:none;stroke:var(--muted);stroke-width:.8;opacity:.55}.pat-stars .pt-dot{fill:var(--text);opacity:.7}
.pat-grass .bg-layer{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--bg) 85%,#fff),var(--bg) 75%)}
.pat-petals .pt-petal{fill:var(--accent);opacity:.75}.pat-petals .pt-petal2{fill:color-mix(in srgb,var(--accent) 65%,#000);opacity:.75}
.pat-photo .bg-layer{background:linear-gradient(color-mix(in srgb,var(--bg) 70%,transparent),color-mix(in srgb,var(--bg) 82%,transparent)),var(--bg-image,radial-gradient(circle,var(--soft),var(--bg))) center/cover no-repeat}

/* Screens */
.screen{display:none;min-height:100vh;min-height:100svh;padding:clamp(3.5rem,8vh,5rem) 1rem 3rem;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.screen.active{display:flex}
.screen.active.anim{animation:screen-in .55s ease both}
.screen.bg-soft{background:var(--soft)}.screen.bg-surface{background:var(--surface)}.screen.bg-accent{background:var(--accent)}
@keyframes screen-in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.s-inner{width:100%;max-width:34rem;margin:0 auto;background:var(--panel)}
.s-inner.s-wide{max-width:62rem}
.s-title{font-family:var(--font-title);font-weight:400;font-size:clamp(2.4rem,9vw,4.4rem);line-height:1.1;color:var(--text);margin:0 0 .35em}
.s-heading{font-family:var(--font-title);font-weight:400;font-size:clamp(2rem,7.5vw,3.4rem);line-height:1.15;color:var(--text);margin:0 0 .4em}
.s-sub{color:var(--muted);margin:0 auto 1.4rem;max-width:30rem;font-size:clamp(.9rem,3.6vw,1.05rem)}
.s-hint{border:2px dashed color-mix(in srgb,var(--muted) 50%,transparent);border-radius:14px;padding:1.2rem;color:var(--muted);font-size:.9rem;margin:1rem auto;max-width:26rem}
.s-hint-text{display:inline-block;background:color-mix(in srgb,var(--surface) 82%,transparent);padding:.35rem .9rem;border-radius:999px;color:var(--text);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;animation:blink 1.8s ease-in-out infinite;margin-top:.8rem}
.s-actions{margin-top:1.75rem;display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap}
.btn-soft{background:var(--surface);color:var(--text);box-shadow:none;border:1.5px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.s-back{position:fixed;top:max(.9rem,env(safe-area-inset-top));left:.9rem;z-index:30;width:2.8rem;height:2.8rem;border-radius:50%;border:0;cursor:pointer;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--text);font-size:1.3rem;box-shadow:0 6px 18px -8px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.s-back.show{display:flex}

/* Tap to open */
.intro-tap{background:none;border:0;cursor:pointer;padding:0;width:min(17rem,70vw);margin:.5rem auto 0;display:block;animation:bob 2.6s ease-in-out infinite;transition:transform .3s}
.intro-tap:active{transform:scale(.95)}
.intro-heart{display:block;width:62%;margin:0 auto;animation:beat 1.4s ease-in-out infinite}
.intro-tap.opening{animation:open-pop .7s ease forwards}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
@keyframes open-pop{40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(.2);opacity:0}}

/* Passcode */
.pc-mascot,.yn-mascot,.qz-mascot{width:clamp(6.5rem,28vw,9rem);margin:0 auto .4rem}
.pc .s-title{font-size:clamp(2rem,8vw,3.2rem)}
.pc-dots{display:flex;justify-content:center;gap:.6rem;margin:.4rem 0 1.4rem}
.pc-dot{width:2.6rem;height:3rem;border-radius:10px;background:var(--surface);border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent-text,var(--accent));font-size:1.3rem;transition:transform .15s}
.pc-dot.filled{background:var(--accent);color:var(--on-accent);transform:scale(1.05)}
.pc-pad{display:grid;grid-template-columns:repeat(3,4.4rem);gap:.8rem;justify-content:center}
.key{position:relative;width:4.4rem;height:4.4rem;border:0;cursor:pointer;font:inherit;font-size:1.45rem;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s;box-shadow:0 8px 18px -10px var(--accent)}
.key:active{transform:scale(.9)}
.key-del{background:var(--surface);color:var(--text);font-size:1.2rem}
.pc-hearts .key:not(.key-del){background:none;box-shadow:none}
.pc-hearts .key svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--accent);filter:drop-shadow(0 6px 8px color-mix(in srgb,var(--accent) 35%,transparent))}
.pc-hearts .key span{position:relative;margin-top:-.15rem}
.pc-phone .key{background:color-mix(in srgb,var(--text) 14%,transparent);color:var(--text);backdrop-filter:blur(6px);box-shadow:none;font-weight:400;font-size:1.7rem}
.pc-phone .pc-dot{width:.9rem;height:.9rem;border-radius:50%;background:transparent;border:1.5px solid var(--text);font-size:0;color:transparent}
.pc-phone .pc-dot.filled{background:var(--text)}
.pc-phone .s-title{font-family:var(--font-b);font-size:1.15rem;font-weight:500;letter-spacing:.02em}
.pc.shake .pc-dots{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pc-msg{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);padding:1rem}
.pc-msg[hidden]{display:none}
.pc-msg>*{max-width:18rem}
.pc-msg .ill-mascot{width:8rem;margin-bottom:.5rem}
.pc-msg p{background:var(--surface);padding:.9rem 1.4rem;border-radius:16px;font-weight:600;color:var(--text);box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}

/* Yes / No */
.yn-buttons{display:flex;justify-content:center;gap:1.1rem;margin-top:.5rem}
.yn-btn{width:4.2rem;height:4.2rem;border-radius:50%;border:0;cursor:pointer;font-size:1.8rem;font-weight:700;color:var(--on-accent);background:color-mix(in srgb,var(--accent) 80%,#000);box-shadow:0 10px 20px -10px var(--accent);transition:transform .15s}
.yn-btn:active{transform:scale(.9)}
.yn-yes{background:var(--accent)}
.yn-labels{display:flex;justify-content:center;gap:3.2rem;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;margin-top:.5rem}
.yn .s-title{font-family:var(--font-h);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,9vw,3.4rem);color:var(--accent-text,var(--accent));letter-spacing:.01em}
.yn .s-sub{text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;font-weight:600}

/* Quiz */
.qz-box{background:var(--surface);border-radius:20px;padding:1.4rem 1.1rem;box-shadow:0 14px 34px -22px rgba(0,0,0,.5)}
.qz-count{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text,var(--accent));font-weight:700;margin:0 0 .3rem}
.qz-question{font-family:var(--font-h);font-size:1.3rem;color:var(--text);margin:0 0 1rem}
.qz-choices{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.qz-choice{border:2px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--bg);color:var(--text);border-radius:14px;padding:.85rem .6rem;font:inherit;font-weight:600;cursor:pointer;transition:transform .12s,background .2s}
.qz-choice:hover{background:var(--soft)}.qz-choice:active{transform:scale(.96)}
.qz-fail-title{color:#e05267}.qz-ok-title{color:#3bb273}

/* Gift menu */
.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(.7rem,3vw,1.4rem);margin:0 auto;max-width:30rem}
@media(min-width:760px){.hub-grid.hub-n3{grid-template-columns:repeat(3,1fr);max-width:46rem}.hub-grid.hub-n4{grid-template-columns:repeat(4,1fr);max-width:58rem}.hub-grid.hub-n1{grid-template-columns:1fr;max-width:16rem}}
.hub-tile{position:relative;border:0;cursor:pointer;background:var(--surface);border-radius:22px;padding:1rem .7rem .9rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--text);font:inherit;box-shadow:0 12px 26px -18px rgba(0,0,0,.55);transition:transform .2s}
.hub-tile:hover{transform:translateY(-4px) rotate(-1deg)}.hub-tile:active{transform:scale(.96)}
.hub-pic{width:72%;max-width:9rem;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.hub-pic .ill{max-height:100%}
.hub-label{margin-top:auto;font-weight:600;font-size:clamp(.82rem,3.4vw,1rem)}
.hub-check{position:absolute;top:.5rem;right:.6rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.8rem;display:none;align-items:center;justify-content:center}
.hub-tile.visited .hub-check{display:flex}
.hub-finale{animation:beat 2.4s ease-in-out infinite}

/* Letter */
.letter-env{background:none;border:0;cursor:pointer;width:min(19rem,78vw);margin:0 auto;display:block;animation:bob 2.6s ease-in-out infinite}
.paper{position:relative;text-align:left;background:#fffdf8;color:#3b2f31;padding:2rem 1.5rem;border-radius:6px;box-shadow:0 18px 40px -22px rgba(0,0,0,.55);font-size:clamp(.95rem,3.8vw,1.05rem);line-height:1.8;max-width:36rem;margin:0 auto;animation:paper-in .7s ease both}
.paper-lined{background-image:linear-gradient(transparent calc(1.8em - 1px),color-mix(in srgb,var(--accent) 22%,transparent) 0);background-size:100% 1.8em;background-position:0 1.6rem;padding-left:2.2rem;border-left:0}
.paper-lined::before{content:"";position:absolute;left:1.35rem;top:0;bottom:0;width:2px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.paper-stamp{border-radius:0;--m:radial-gradient(circle at 7px 7px,transparent 4.5px,#000 5px) -7px -7px/14px 14px,linear-gradient(#000 0 0) center/calc(100% - 14px) calc(100% - 14px) no-repeat;-webkit-mask:var(--m);mask:var(--m);padding:2.4rem 2rem;background:#f8f1e3}
.paper-pinned{border:3px solid var(--accent);border-radius:14px;padding-top:2.4rem}
.paper-pin{position:absolute;top:-.9rem;left:50%;width:4.5rem;transform:translateX(-50%) rotate(-8deg)}
.paper-greeting{font-family:var(--font-script);font-size:1.9em;color:var(--accent-text,var(--accent));line-height:1.2;margin:0 0 .5rem}
.paper-sign{font-family:var(--font-script);font-size:1.7em;color:var(--accent-text,var(--accent));text-align:right;margin:1rem 0 0;line-height:1.3}
@keyframes paper-in{from{opacity:0;transform:translateY(40px) rotate(-2deg)}to{opacity:1;transform:none}}

/* Flowers */
.fl-wrap{display:grid;grid-template-columns:1fr;justify-items:center;gap:1rem}
.fl-pic{position:relative;width:min(17rem,70vw);animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(2deg)}}
.fl-vase-text{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);color:#fff;font-family:var(--font-h);font-weight:600;font-size:clamp(.7rem,2.8vw,.9rem);letter-spacing:.06em;text-transform:uppercase;width:44%;line-height:1.25}
.fl-foryou{margin:.6rem 0 0;text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:0;animation:fl-foryou 1.4s 2.6s forwards}@keyframes fl-foryou{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fl-notes{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem}
.sticker{display:inline-block;background:var(--surface);color:var(--text);border:2px solid var(--accent);border-radius:12px;padding:.45rem .9rem;font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;box-shadow:3px 4px 0 color-mix(in srgb,var(--accent) 40%,transparent);transform:rotate(var(--r,0deg));animation:fade-up .5s ease both}
.fl-notes .sticker:nth-child(2){animation-delay:.1s}.fl-notes .sticker:nth-child(3){animation-delay:.2s}.fl-notes .sticker:nth-child(4){animation-delay:.3s}
@media(min-width:760px){.fl-wrap{grid-template-columns:1fr auto 1fr;align-items:center;gap:2rem}.fl-notes{flex-direction:column;gap:1rem}.fl-left{align-items:flex-end}.fl-right{align-items:flex-start}.fl-pic{width:20rem}}
.fl-reveal{display:flex;flex-direction:column;align-items:center;gap:1rem}
.fl-list{display:flex;flex-direction:column;gap:.5rem;width:min(22rem,90%)}
.fl-note{margin:0;background:var(--surface);border-radius:12px;padding:.7rem 1rem;color:var(--text);font-weight:600;animation:fade-up .4s ease both}

/* Cake */
.cake-btn{background:none;border:0;cursor:pointer;width:min(18rem,72vw);margin:0 auto;display:block}
.flame{transform-origin:50% 100%;transform-box:fill-box;animation:flicker .5s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scale(1.08,.92) rotate(3deg)}}
.candle.out .flame{animation:none;opacity:0;transition:opacity .25s}
.smoke{opacity:0}.candle.out .smoke{animation:smoke 1.6s ease forwards}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-20px)}}
.cake-after{animation:fade-up .6s ease both;margin-top:1rem}

/* Photos */
.ph-item{margin:0;cursor:zoom-in}
.ph-item img{width:100%;display:block;object-fit:cover;background:var(--soft)}
.ph-item figcaption{font-family:var(--font-script);font-size:1.15rem;color:var(--text);margin-top:.35rem;line-height:1.2}
.ph-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.ph-grid img{aspect-ratio:1;border-radius:var(--radius-img)}
.ph-scrapbook,.ph-polaroids,.ph-corkboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem .9rem;padding:.5rem}
@media(min-width:760px){.ph-grid,.ph-scrapbook,.ph-polaroids,.ph-corkboard{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6rem 1.4rem}}
@media(min-width:1100px){.ph-polaroids,.ph-corkboard{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ph-scrapbook .ph-item{position:relative;background:#fff;padding:.45rem;box-shadow:0 10px 22px -14px rgba(0,0,0,.6);transform:rotate(var(--t));transition:transform .3s}
.ph-scrapbook .ph-item:nth-child(3n+2){border:3px solid var(--accent)}
.ph-scrapbook .ph-item img{aspect-ratio:4/5}
.ph-scrapbook .ph-item:hover,.ph-polaroids .ph-item:hover{transform:rotate(0) scale(1.03);z-index:2}
.tape{position:absolute;top:-.7rem;left:50%;width:4.2rem;height:1.3rem;transform:translateX(-50%) rotate(-4deg);background:color-mix(in srgb,var(--soft) 80%,#fff);opacity:.9;box-shadow:0 2px 4px rgba(0,0,0,.1);z-index:2}
.ph-polaroids .ph-item{background:#fff;padding:.55rem .55rem 1.3rem;box-shadow:0 12px 26px -14px rgba(0,0,0,.6);transform:rotate(var(--t));transition:transform .3s}
.ph-polaroids .ph-item img{aspect-ratio:1}
.ph-polaroids figcaption{color:#3b2f31;font-size:1rem}
.ph-corkboard{background:#c99b6d;background-image:radial-gradient(#b7875a 1.2px,transparent 1.5px),radial-gradient(#d9ae80 1px,transparent 1.3px);background-size:9px 9px,13px 13px;border:10px solid #8a5b35;border-radius:10px;padding:1.4rem 1rem}
.ph-corkboard .ph-item{position:relative;background:#fff;padding:.4rem .4rem 1rem;transform:rotate(var(--t));box-shadow:0 8px 16px -10px rgba(0,0,0,.6)}
.ph-corkboard figcaption{color:#3b2f31;font-size:.95rem}
.pushpin{position:absolute;top:-.45rem;left:50%;width:1rem;height:1rem;border-radius:50%;background:var(--accent);transform:translateX(-50%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),0 3px 4px rgba(0,0,0,.3);z-index:2}
.ph-strips{display:flex;flex-wrap:wrap;justify-content:center;gap:1.1rem}
.ph-strip{width:min(9.5rem,40vw);background:#fff;padding:.5rem .5rem 1.4rem;display:flex;flex-direction:column;gap:.5rem;transform:rotate(var(--t));box-shadow:0 14px 26px -16px rgba(0,0,0,.6)}
.ph-strip img{aspect-ratio:4/3}.ph-strip figcaption{display:none}
.ph-strip:nth-child(even){background:#1f1b1c}

/* Song */
.song{display:grid;grid-template-columns:1fr;gap:1.4rem;align-items:center;justify-items:center}
@media(min-width:760px){.song{grid-template-columns:auto 1fr;text-align:left;justify-items:start}}
.song-art{position:relative;width:min(16rem,64vw)}
.song-vinyl{width:100%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.song-photo{position:absolute;right:-12%;bottom:-8%;width:52%;aspect-ratio:1;object-fit:cover;border:6px solid #fff;box-shadow:0 10px 20px -10px rgba(0,0,0,.6);transform:rotate(6deg)}
.song-side{width:100%;max-width:32rem}
.song-title{font-family:var(--font-h);font-size:1.5rem;font-weight:700;color:var(--text);margin:0}
.song-artist{color:var(--muted);margin:0 0 .9rem}
.song-player{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 14px 30px -18px rgba(0,0,0,.7)}
.song-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.song-msg{margin-top:1rem;color:var(--text)}

/* Reasons */
.rs-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;max-width:44rem;margin:0 auto}
@media(min-width:760px){.rs-cards{grid-template-columns:repeat(3,1fr)}}
.flip{border:0;background:none;padding:0;cursor:pointer;perspective:800px;aspect-ratio:4/5;font:inherit}
.flip-in{position:relative;display:block;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.9rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 12px 24px -16px rgba(0,0,0,.55)}
.flip-front{background:var(--accent);color:var(--on-accent)}
.flip-front b{font-family:var(--font-title);font-size:2.6rem;font-weight:400;line-height:1}
.flip-front small{opacity:.8;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.flip-back{background:var(--surface);color:var(--text);transform:rotateY(180deg);font-weight:600;font-size:clamp(.82rem,3.4vw,.98rem);line-height:1.4}
.rs-sticky{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;max-width:46rem;margin:0 auto}
@media(min-width:760px){.rs-sticky{grid-template-columns:repeat(3,1fr)}}
.note{margin:0;min-height:7rem;background:#fff6a8;color:#3b2f31;padding:1.1rem .9rem;font-family:var(--font-script);font-size:1.25rem;line-height:1.3;display:flex;align-items:center;justify-content:center;transform:rotate(var(--t));box-shadow:0 10px 18px -12px rgba(0,0,0,.6)}
.note:nth-child(3n+2){background:var(--soft)}.note:nth-child(3n){background:#cdeffd}
.rs-list{list-style:none;padding:0;margin:0 auto;display:grid;gap:.6rem;max-width:44rem;text-align:left}
@media(min-width:760px){.rs-list{grid-template-columns:1fr 1fr;column-gap:1.5rem}}
.rs-list li{display:flex;gap:.7rem;align-items:flex-start;color:var(--text)}
.rs-list li span{color:var(--accent-text,var(--accent));flex:0 0 auto}
.rs-reveal{max-width:30rem;margin:0 auto}
.rs-one{background:var(--surface);border-radius:16px;padding:1.2rem;color:var(--text);font-size:1.1rem;animation:fade-up .45s ease both;margin:0 0 .6rem}
.rs-one b{color:var(--accent-text,var(--accent))}

/* Calendar */
.cal-wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1.4rem}
.cal{background:#fffdf8;color:#3b2f31;width:min(20rem,86vw);padding:1.3rem 1.1rem 1.4rem;border-radius:6px;box-shadow:0 18px 34px -20px rgba(0,0,0,.6);transform:rotate(2deg)}
.cal-month{font-family:var(--font-script);font-size:2.4rem;color:var(--accent-text,var(--accent));margin:0;line-height:1}
.cal-year{margin:.1rem 0 .7rem;color:#8b7d7f;letter-spacing:.2em;font-size:.8rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;font-size:.85rem}
.cal-grid b{font-size:.7rem;color:#8b7d7f}
.cal-grid span{position:relative;padding:.25rem 0}
.cal-mark{color:#fff;font-weight:700}
.cal-mark::before{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:2rem;color:var(--accent-text,var(--accent));z-index:-1;animation:beat 1.6s ease-in-out infinite}
.cal-grid span{z-index:0}
.cal-photo{position:relative;margin:0;width:min(13rem,60vw);background:#fff;padding:.5rem;transform:rotate(-4deg);box-shadow:0 14px 26px -16px rgba(0,0,0,.6)}
.cal-photo img{aspect-ratio:4/5;object-fit:cover}
.cal-note{margin-top:1rem;color:var(--text)}

/* Locket and ending */
.locket{width:min(30rem,92vw);margin:0 auto;display:block;filter:drop-shadow(0 16px 20px rgba(0,0,0,.25));animation:bob 4s ease-in-out infinite}
.locket-msg,.end-msg{color:var(--text);max-width:32rem;margin:1rem auto 0}
.end-title{font-size:clamp(3rem,12vw,5.6rem)}
.end-photo{margin:.5rem auto 1rem;width:min(15rem,70vw);background:#fff;padding:.6rem .6rem 1.6rem;transform:rotate(-3deg);box-shadow:0 16px 30px -16px rgba(0,0,0,.6)}
.end-photo img{aspect-ratio:4/5;object-fit:cover}

@media(max-height:620px) and (orientation:landscape){
  .screen{justify-content:flex-start}
  .pc-pad{grid-template-columns:repeat(3,3.4rem);gap:.5rem}.key{width:3.4rem;height:3.4rem;font-size:1.15rem}
  .pc-mascot,.yn-mascot,.qz-mascot{width:5rem}
  .intro-tap,.letter-env,.cake-btn{width:min(12rem,40vw)}
}
@media(min-width:760px) and (max-height:620px){.pc{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:1rem 2rem;max-width:44rem}.pc>*{grid-column:1}.pc .pc-pad{grid-row:1/6;grid-column:2}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes fade-up{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}

.stk-svg{overflow:visible}
.stk-slot{display:block}
.mascot-img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
.stk-slot .stk-img{display:block;width:auto;max-width:100%;height:auto;max-height:clamp(7rem,32vw,10rem);margin:0 auto;object-fit:contain}
.has-stk .pc-mascot,.has-stk .yn-mascot,.has-stk .qz-mascot{display:none}
.stk{transform-box:fill-box;transform-origin:50% 100%;animation:stk-bounce 1.8s ease-in-out infinite}
.stk-blink{transform-box:fill-box;transform-origin:center;animation:stk-blink 4s infinite}
.stk-beat{transform-box:fill-box;transform-origin:center;animation:stk-beat 1.3s ease-in-out infinite}
